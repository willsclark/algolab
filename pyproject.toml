[project]
name = "algolab"
version = "0.1.0"
description = "An empirical analysis of sorting, bin-packing, and network structures."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pydantic>=2.13.3",
]

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6"]

[tool.ruff]
line-length = 100
extend-exclude = ["*/project2-writeup/*", "*/report/*", "*/sorts-writeup/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, import-sorting

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algolab", "datastructures"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
